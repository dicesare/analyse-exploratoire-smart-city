[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paris-trees-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8",
    "ruff>=0.6",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["tree_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["notebooks/P2_01_notebook.ipynb"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
