<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Paris tree analysis funnel</title><desc id="d">Data quality steps from source inventory to morphology sample.</desc><rect width="960" height="430" fill="#052e2b"/><text x="45" y="50" fill="#f0fdfa" font-family="Arial" font-size="26" font-weight="700">P2 — Paris tree inventory, made analytically trustworthy</text><text x="45" y="80" fill="#99f6e4" font-family="Arial" font-size="14">Verified checkpoints from the executed notebook</text><g font-family="Arial"><rect x="70" y="125" width="820" height="65" rx="12" fill="#0f766e"/><text x="480" y="155" fill="#fff" text-anchor="middle" font-size="22" font-weight="700">200,137 source records · 18 fields</text><text x="480" y="178" fill="#ccfbf1" text-anchor="middle" font-size="13">missingness, semantic errors and impossible measurements</text><path d="M480 190 L480 220" stroke="#5eead4" stroke-width="4"/><rect x="150" y="220" width="660" height="65" rx="12" fill="#14b8a6"/><text x="480" y="250" fill="#042f2e" text-anchor="middle" font-size="22" font-weight="700">200,110 distinct coordinates</text><text x="480" y="273" fill="#134e4a" text-anchor="middle" font-size="13">coordinate duplicate removal</text><path d="M480 285 L480 315" stroke="#5eead4" stroke-width="4"/><rect x="235" y="315" width="490" height="70" rx="12" fill="#5eead4"/><text x="480" y="347" fill="#042f2e" text-anchor="middle" font-size="22" font-weight="700">160,021 morphology observations</text><text x="480" y="372" fill="#134e4a" text-anchor="middle" font-size="13">146 genera · height 1–50 m · circumference 1–700 cm</text></g></svg>

